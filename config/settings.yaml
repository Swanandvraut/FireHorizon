project:
  name: "FireHorizon"
  subtitle: "Satellite Harmonization & Integrated Burning Activity Calendar"
  version: "1.0.0"
  event: "NASA Space Apps Challenge 2026 — Kopargaon"
  challenge: "Harmonization of MODIS and VIIRS Hot Spots"
  team:
    - "Swanand Raut"
    - "Swaral Dabhade"
    - "Raj Dakle"
    - "Vishal Sable"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  boundary_dir: "data/boundaries"
  export_dir: "data/exports"
  sample_dir: "data/sample"
  date_start: "2025-03-01"
  date_end: "2025-03-31"

sources:
  DL_FIRE_SV-C2_846910:
    family: "VIIRS"
    platform: "Suomi-NPP"
    product: "VIIRS_SNPP"
    instrument: "VIIRS"
    confidence_encoding: "categorical (l/n/h)"
    nominal_resolution_m: 375
  DL_FIRE_J1V-C2_846908:
    family: "VIIRS"
    platform: "NOAA-20"
    product: "VIIRS_NOAA20"
    instrument: "VIIRS"
    confidence_encoding: "categorical (l/n/h)"
    nominal_resolution_m: 375
  DL_FIRE_J2V-C2_846909:
    family: "VIIRS"
    platform: "NOAA-21"
    product: "VIIRS_NOAA21"
    instrument: "VIIRS"
    confidence_encoding: "categorical (l/n/h)"
    nominal_resolution_m: 375
  DL_FIRE_M-C61_846907:
    family: "MODIS"
    platform: "Terra/Aqua"
    product: "MODIS_C61"
    instrument: "MODIS"
    confidence_encoding: "numeric product value (0-100)"
    nominal_resolution_m: 1000

spatial_grid:
  projection: "EPSG:6933"  # WGS 84 / World Cylindrical Equal Area
  default_resolution_m: 1000
  sensitivity_resolutions_m: [500, 1000, 2000]

matching:
  default_distance_meters: 1000.0
  default_time_minutes: 60.0
  sensitivity_distances_meters: [500, 1000, 2000]
  sensitivity_times_minutes: [30, 60, 120]

harmonization:
  methodology_version: "v1.0-provisional"
  weights:
    modis: 1.0
    viirs_snpp: 0.6
    viirs_noaa20: 0.6
    viirs_noaa21: 0.6

regions:
  india:
    name: "India"
    type: "Country"
  maharashtra:
    name: "Maharashtra"
    type: "State"
    geojson_path: "data/boundaries/maharashtra.geojson"
    source: "Survey of India / Natural Earth / Datameet India Boundaries"
